<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROADWATCH - Notification Center & Operational Alerts</title>
  
  <!-- FontAwesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar"></aside>

    <!-- Main Content Shell -->
    <main class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" title="Toggle Navigation Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-title-group">
            <h1>Notification Center & System Alerts</h1>
            <div class="page-breadcrumb">
              <a href="dashboard.html">Dashboard</a>
              <i class="fa-solid fa-chevron-right" style="font-size:0.65rem;"></i>
              <span>Operational Activity Stream</span>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <div class="live-clock-badge">
            <div class="live-pulse"></div>
            <span id="liveClockText">Live Telemetry</span>
          </div>
          <button class="btn btn-outline btn-sm" id="btnMarkAllRead">
            <i class="fa-solid fa-check-double"></i> Mark All as Read
          </button>
          <button class="btn btn-danger btn-sm" id="btnClearAllNotifs">
            <i class="fa-solid fa-trash-can"></i> Clear All
          </button>
        </div>
      </header>

      <!-- Notifications Page Content -->
      <div class="page-content" style="max-width: 920px; margin: 0 auto;">

        <!-- Header Toolbar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <button class="btn btn-primary btn-sm notif-filter-tab" data-filter="all">
              All Notifications
            </button>
            <button class="btn btn-outline btn-sm notif-filter-tab" data-filter="unread">
              Unread Only
            </button>
            <span class="badge badge-normal" id="unreadNotifsCountDisplay" style="margin-left: 0.5rem;">0 Unread</span>
          </div>

          <div style="font-size: 0.8rem; color: var(--text-muted);">
            <i class="fa-solid fa-database"></i> Stored in Browser LocalStorage
          </div>
        </div>

        <!-- Notification Feed List Container -->
        <div id="notificationsFeedList">
          <!-- Populated dynamically by js/notifications.js -->
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>

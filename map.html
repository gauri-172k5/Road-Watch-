<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROADWATCH - Interactive Road Damage GIS Map</title>
  
  <!-- FontAwesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    #roadMapContainer {
      width: 100%;
      height: calc(100vh - 210px);
      min-height: 520px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--card-border);
      z-index: 10;
    }
    .map-floating-legend {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-md);
      z-index: 500;
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar"></aside>

    <!-- Main Content Shell -->
    <main class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" title="Toggle Navigation Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-title-group">
            <h1>Road Damage GIS Spatial Map</h1>
            <div class="page-breadcrumb">
              <a href="dashboard.html">Dashboard</a>
              <i class="fa-solid fa-chevron-right" style="font-size:0.65rem;"></i>
              <span>Live Infrastructure Map</span>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <div class="live-clock-badge">
            <div class="live-pulse"></div>
            <span id="liveClockText">Live Telemetry</span>
          </div>
          <a href="notifications.html" class="topbar-action-btn" title="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-badge-bubble" id="topbarNotifBadge" style="display:none;">0</span>
          </a>
          <a href="report.html" class="btn btn-warning btn-sm">
            <i class="fa-solid fa-plus"></i> Report Hazard
          </a>
        </div>
      </header>

      <!-- Map & Controls Content -->
      <div class="page-content">
        
        <!-- Filter and Search Toolbar -->
        <div class="filter-toolbar">
          <div class="filter-group-left">
            <div class="search-input-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="mapSearchInput" class="form-control" placeholder="Search road name, area or ID...">
            </div>

            <select id="mapCategoryFilter" class="filter-select">
              <option value="all">All Damage Categories</option>
              <option value="Potholes">Potholes</option>
              <option value="Road cracks">Road cracks</option>
              <option value="Waterlogging">Waterlogging</option>
              <option value="Broken road surfaces">Broken road surfaces</option>
              <option value="Uneven roads">Uneven roads</option>
              <option value="Damaged footpaths">Damaged footpaths</option>
              <option value="Other">Other</option>
            </select>

            <select id="mapSeverityFilter" class="filter-select">
              <option value="all">All Severities</option>
              <option value="High">High Severity (Red)</option>
              <option value="Medium">Medium Severity (Orange)</option>
              <option value="Low">Low Severity (Green)</option>
            </select>
          </div>

          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">
              Plotted: <strong id="mapActiveCount" style="color:var(--accent-blue);">0</strong> locations
            </span>
            <button class="btn btn-primary btn-sm" id="mapLocateMeBtn">
              <i class="fa-solid fa-crosshairs"></i> Locate Me
            </button>
          </div>
        </div>

        <div id="mapGpsNotice" style="margin-bottom:0.75rem; font-size:0.8rem;"></div>

        <!-- Map Container Relative Frame -->
        <div style="position:relative;">
          <div id="roadMapContainer"></div>

          <!-- Floating Map Legend -->
          <div class="map-floating-legend">
            <div style="font-weight:700; color:var(--primary-navy); margin-bottom:0.5rem; text-transform:uppercase; font-size:0.7rem; letter-spacing:0.05em;">
              Severity Indicator
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#ef4444;"></div>
              <span><strong>High Severity</strong> (Potholes/Flooding)</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#f59e0b;"></div>
              <span><strong>Medium Severity</strong> (Cracks/Undulation)</span>
            </div>
            <div class="legend-item" style="margin-bottom:0;">
              <div class="legend-dot" style="background:#10b981;"></div>
              <span><strong>Low Severity</strong> (Footpaths/Surface)</span>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
